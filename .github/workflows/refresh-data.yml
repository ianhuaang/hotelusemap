name: Refresh NYC Open Data

on:
  schedule:
    # Every Monday at 6am UTC (2am ET)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

# The refreshed geojson is published to ianhuaang/kasa-sourcing, which needs
# KASA_SOURCING_TOKEN rather than GITHUB_TOKEN — a token can only ever reach
# its own repository. contents: write is kept for the checkout itself.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Free, and moves us off the per-IP pool that GitHub's shared runners
      # contend for. Absent, everything still works, just throttled.
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    # Must exceed the sum of the per-step caps (275 min). If the job cap fires
    # first, the run is cancelled before the verify step can report which
    # sources failed — the cap killing the run costs us the diagnosis. Real
    # runs land far under: run #7 pulled everything in 1h46m.
    # Must exceed the sum of every step cap (310m) or the job dies before a
    # slow step does, and the guard never gets to say which source was short.
    # GitHub kills hosted jobs at 360m, so this is close to the real ceiling.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install certifi

      # Every pull carries continue-on-error so a single flaky source doesn't
      # abort the run — one run then tells us everything that broke instead of
      # only the first failure. The cost is that a timed-out step reports its
      # conclusion as "success", so the guard step after Phase 3 is what
      # actually decides whether the data is complete enough to publish.
      # Each step needs an id so that guard can read its true outcome.

      # Phase 1: Pull independent data sources (no dependencies)
      - name: Pull PLUTO
        id: p_pluto
        run: python src/pull_pluto.py
        continue-on-error: true
        timeout-minutes: 15

      - name: Pull HPD
        id: p_hpd
        run: python src/pull_hpd.py
        continue-on-error: true
        timeout-minutes: 20

      - name: Pull building footprints
        id: p_footprints
        run: python src/pull_footprints.py
        continue-on-error: true
        timeout-minutes: 50

      - name: Pull DOF sales
        id: p_sales
        run: python src/pull_sales.py
        continue-on-error: true
        timeout-minutes: 25

      - name: Pull DOB permits
        id: p_permits
        run: python src/pull_permits.py
        continue-on-error: true
        timeout-minutes: 40

      - name: Pull DCWP hotel licenses
        id: p_licenses
        run: python src/pull_hotel_licenses.py
        continue-on-error: true
        timeout-minutes: 15

      - name: Pull DOB occupancy
        id: p_occupancy
        run: python src/pull_dob_occupancy.py
        continue-on-error: true
        timeout-minutes: 15

      # Checkpoint. The full verification runs at the end, but waiting for it
      # means a source that dies at minute 20 still burns the remaining 90
      # before anyone is told. Phase 2 cannot produce a correct build without
      # these, so stop here instead.
      - name: Checkpoint — phase 1 sources
        run: |
          FAILED=""
          for pair in "PLUTO:${{ steps.p_pluto.outcome }}" \
                      "HPD:${{ steps.p_hpd.outcome }}" \
                      "building footprints:${{ steps.p_footprints.outcome }}" \
                      "DOF sales:${{ steps.p_sales.outcome }}" \
                      "DOB permits:${{ steps.p_permits.outcome }}" \
                      "DCWP hotel licenses:${{ steps.p_licenses.outcome }}" \
                      "DOB occupancy:${{ steps.p_occupancy.outcome }}"; do
            name="${pair%:*}"; outcome="${pair##*:}"
            [ "$outcome" != "success" ] && FAILED="$FAILED\n  - $name ($outcome)"
          done
          if [ -n "$FAILED" ]; then
            echo "::error title=Phase 1 incomplete::Stopping before the pipeline build."
            printf '%b\n' "Sources that did not complete:$FAILED"
            exit 1
          fi
          echo "Phase 1 complete."

      # Phase 2: Run pipeline (needs PLUTO + HPD)
      - name: Run pipeline
        run: python src/pipeline.py

      # Phase 3: Pull data that depends on pipeline output

      # Moved here from phase 1 on 9 Sep 2026. It used to pull open violations
      # for all of Manhattan/Brooklyn/Queens — 2.1M rows across 76k buildings —
      # to compute two integers for each of the ~15k buildings in the pipeline,
      # so its runtime tracked NYC's data rather than ours. It outgrew a 15m cap
      # and then a 45m one. Reading the pipeline's BBL list first cuts it to
      # ~55k rows. pipeline.py has no distress dependency, so the reorder is safe.
      - name: Pull distress signals (HPD violations, ECB, tax liens, lis pendens)
        id: p_distress
        run: python src/pull_distress.py
        continue-on-error: true
        timeout-minutes: 65

      - name: Pull C of O records
        id: p_coo
        run: python src/pull_coo.py
        continue-on-error: true
        timeout-minutes: 15

      # Truncated at 10m in run #7, then again at 25m on 8 Sep 2026 — it ran
      # 25.2m and was killed a few seconds over. Raised to 45 rather than 30:
      # this source has now outgrown two caps set just above its previous run
      # time, and a cap chosen to barely fit is a cap that fails again the next
      # time ACRIS is slow. The job's own 300m budget is the real ceiling.
      - name: Pull ACRIS owners
        id: p_acris
        run: python src/pull_acris_owners.py
        continue-on-error: true
        timeout-minutes: 110

      # Truncated at 10m in run #7.
      - name: Pull HPD registrations
        id: p_hpdreg
        run: python src/pull_hpd_registrations.py
        continue-on-error: true
        timeout-minutes: 25

      # Truncated at 10m in run #7.
      - name: Pull alt addresses
        id: p_altaddr
        run: python src/pull_alt_addresses.py
        continue-on-error: true
        timeout-minutes: 80

      - name: Pull LPC landmarks
        id: p_landmarks
        run: python src/pull_landmarks.py
        continue-on-error: true
        timeout-minutes: 15

      # Truncated at 30m in run #7.
      - name: Pull tax benefits (421-a/J-51)
        id: p_taxben
        run: python src/pull_tax_benefits.py
        continue-on-error: true
        timeout-minutes: 70

      - name: Pull rent stabilization
        id: p_rentstab
        run: python src/pull_rent_stabilization.py
        continue-on-error: true
        timeout-minutes: 15

      # Gate: refuse to publish a build made from truncated inputs.
      #
      # continue-on-error rewrites a timed-out step's `conclusion` to success,
      # so `outcome` is the only field that tells the truth. Run #7 reported all
      # 23 steps green while five sources had actually been killed at their cap,
      # and would have committed that partial build silently. This reports every
      # bad source at once, then stops the run before enrichment.
      - name: Verify every source completed
        run: |
          FAILED=""
          check() {
            if [ "$2" != "success" ]; then
              FAILED="$FAILED\n  - $1 ($2)"
            fi
          }
          check "PLUTO"              "${{ steps.p_pluto.outcome }}"
          check "HPD"                "${{ steps.p_hpd.outcome }}"
          check "building footprints" "${{ steps.p_footprints.outcome }}"
          check "DOF sales"          "${{ steps.p_sales.outcome }}"
          check "DOB permits"        "${{ steps.p_permits.outcome }}"
          check "distress signals"   "${{ steps.p_distress.outcome }}"
          check "DCWP hotel licenses" "${{ steps.p_licenses.outcome }}"
          check "DOB occupancy"      "${{ steps.p_occupancy.outcome }}"
          check "C of O"             "${{ steps.p_coo.outcome }}"
          check "ACRIS owners"       "${{ steps.p_acris.outcome }}"
          check "HPD registrations"  "${{ steps.p_hpdreg.outcome }}"
          check "alt addresses"      "${{ steps.p_altaddr.outcome }}"
          check "LPC landmarks"      "${{ steps.p_landmarks.outcome }}"
          check "tax benefits"       "${{ steps.p_taxben.outcome }}"
          check "rent stabilization" "${{ steps.p_rentstab.outcome }}"
          if [ -n "$FAILED" ]; then
            echo "::error title=Incomplete data pull::One or more sources did not complete. Not publishing a partial build."
            printf '%b\n' "Sources that did not complete:$FAILED"
            echo "A step that hit its timeout-minutes cap shows here even though the run log marks it green."
            exit 1
          fi
          echo "All 15 sources completed."

      # Every cap here was set just above the previous run time, so each one
      # eventually failed. This prints how close each step came, so drift shows
      # up as a warning weeks before it becomes a failed run.
      - name: Report step runtimes against caps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/report_step_budget.py

      # Phase 4: Enrich and build
      - name: Run enrichment
        run: python src/enrich.py

      - name: Build GeoJSON
        run: python src/build_geojson.py

      # The map lives in ianhuaang/kasa-sourcing now, not here. Publishing into
      # this repo would refresh a file nothing reads, so push straight to the
      # app repo instead. Needs KASA_SOURCING_TOKEN — a fine-grained PAT with
      # Contents: read and write on kasa-sourcing only. The default
      # GITHUB_TOKEN cannot reach another repository.
      - name: Publish GeoJSON to the app repo
        env:
          KASA_SOURCING_TOKEN: ${{ secrets.KASA_SOURCING_TOKEN }}
        run: |
          if [ -z "$KASA_SOURCING_TOKEN" ]; then
            echo "::error title=Missing secret::KASA_SOURCING_TOKEN is not set, so the refreshed data cannot reach the app."
            exit 1
          fi
          TODAY=$(date +%Y%m%d)
          SRC="data/processed/buildings_${TODAY}.geojson"
          test -s "$SRC" || { echo "::error::$SRC missing or empty"; exit 1; }

          git clone --depth 1 --quiet \
            "https://x-access-token:${KASA_SOURCING_TOKEN}@github.com/ianhuaang/kasa-sourcing.git" /tmp/app
          cp "$SRC" /tmp/app/map/public/buildings.geojson

          cd /tmp/app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add map/public/buildings.geojson
          if git diff --cached --quiet; then
            echo "No change in the data — nothing to publish."
            exit 0
          fi
          FEATURES=$(python3 -c "import json;print(len(json.load(open('map/public/buildings.geojson'))['features']))")
          git commit -m "Auto-refresh: update buildings data $(date +%Y-%m-%d) (${FEATURES} features)"
          git push
          echo "Published ${FEATURES} features. Vercel will redeploy kasa-sourcing."
