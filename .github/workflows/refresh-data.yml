name: Refresh NYC Open Data

on:
  schedule:
    # Every Monday at 6am UTC (2am ET)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install certifi

      # Phase 1: Pull independent data sources (no dependencies)
      - name: Pull PLUTO
        run: python src/pull_pluto.py

      - name: Pull HPD
        run: python src/pull_hpd.py

      - name: Pull building footprints
        run: python src/pull_footprints.py

      - name: Pull DOF sales
        run: python src/pull_sales.py

      - name: Pull DOB permits
        run: python src/pull_permits.py

      - name: Pull distress signals (HPD violations, ECB, tax liens, lis pendens)
        run: python src/pull_distress.py

      - name: Pull DCWP hotel licenses
        run: python src/pull_hotel_licenses.py

      - name: Pull DOB occupancy
        run: python src/pull_dob_occupancy.py

      # Phase 2: Run pipeline (needs PLUTO + HPD)
      - name: Run pipeline
        run: python src/pipeline.py

      # Phase 3: Pull data that depends on pipeline output
      - name: Pull C of O records
        run: python src/pull_coo.py

      - name: Pull ACRIS owners
        run: python src/pull_acris_owners.py

      - name: Pull HPD registrations
        run: python src/pull_hpd_registrations.py

      - name: Pull alt addresses
        run: python src/pull_alt_addresses.py

      # Phase 4: Enrich and build
      - name: Run enrichment
        run: python src/enrich.py

      - name: Build GeoJSON
        run: python src/build_geojson.py

      - name: Copy GeoJSON to map
        run: |
          TODAY=$(date +%Y%m%d)
          cp data/processed/buildings_${TODAY}.geojson map/public/buildings.geojson

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add map/public/buildings.geojson
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-refresh: update buildings data $(date +%Y-%m-%d)"
          git push
